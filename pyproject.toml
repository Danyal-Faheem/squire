# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squire"
version = "0.1.0"
description = "A pluggable platform for unifying and AI-assisting an open-source maintainer workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Danyal Faheem" }]
dependencies = [
    # Configuration & models
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # HTTP & HTML parsing (forum and docs-site connectors)
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # LLM access via any OpenAI-compatible endpoint
    "openai>=1.40",
    # Data layer: PostgreSQL + pgvector + ORM + migrations
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    # RAG
    "llama-index-core>=0.11",
    # Structure-preserving PDF extraction (pdf connector)
    "pymupdf4llm>=0.0.17",
    # Web service for the brain
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Scheduling for always-on services
    "apscheduler>=3.10",
    # Board (default backend) & messaging (default adapter)
    "PyGithub>=2.3",
    "slack-bolt>=1.19",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",          # httpx mocking
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["squire*"]

# ----------------------------------------------------------------------------
# ruff: formatter + linter. The formatter is black-compatible; the linter
# subsumes isort (import sorting) and the common flake8/pyflakes checks.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length is handled by the formatter, not the linter

[tool.ruff.lint.isort]
known-first-party = ["squire"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends(...) in argument defaults on
# purpose; it is not the mutable-default hazard B008 targets, so allow it.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# mypy: strict typing. Retained alongside ruff because ruff does not type-check.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that require a real Postgres (skipped unless DB available)",
]
