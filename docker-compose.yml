# Local development stack for Squire.
#
# Third-party dependencies use their official images. Postgres uses the official
# pgvector image so the `vector` extension is available. Everything sits on a
# shared user-defined network (`squire-net`) so services resolve each other by
# name. The model endpoints (LLM_BASE_URL / EMBEDDING_BASE_URL) point at an
# external OpenAI-compatible service, configured via the .env file.
#
# As services come online in later phases, add them here following the pattern of
# `brain` below: build from the repo, depend on postgres, join the shared network,
# read configuration from the .env file.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: squire
      POSTGRES_PASSWORD: squire
      POSTGRES_DB: squire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squire"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - squire-net

  # The RAG brain (FastAPI). Built in Phase 2; the service definition is included
  # now so `docker compose up` has the shape it will grow into. Comment it out
  # until the app entrypoint exists.
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn squire.rag.api:app --host 0.0.0.0 --port 9000
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    networks:
      - squire-net

networks:
  squire-net:
    driver: bridge

volumes:
  pgdata:
